# Independent workspace and package for the HELIC-DAQ magneto-elastic rig.
#
# The rig owns its pin map, safety limits and verification contracts; the
# HELIC-DAQ platform crates are pinned by tag and upgraded deliberately.
# See docs/developer_guide.md in the platform repository, section "Adding a rig
# in its own repository".
[workspace]
resolver = "2"

[package]
name = "fw-magnetoelastic-rig"
description = "HELIC-DAQ firmware for the magneto-elastic rig"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Select exactly one physical WIZnet chip. The default matches the controller
# fitted to this rig, so a plain `cargo run --release` flashes the right image.
default = ["board-w5500"]
board-w5500 = ["helic-fw-support/net-wiznet-w5500"]
board-w6100 = ["helic-fw-support/net-wiznet-w6100"]

# Diagnostic builds used to bisect real-time faults. Each removes or loosens
# one part of the loop, so an image built with any of them is not a production
# image and must not be left flashed.
diag-no-status-log = []
diag-no-udp = []
diag-max-command-burst = ["helic-fw-rt/diag-max-command-burst"]
diag-sample-4k = []
diag-skip-adc = []
diag-skip-dac = []
diag-skip-record-enqueue = ["helic-fw-rt/diag-skip-record-enqueue"]
diag-wiznet-10mhz = []

[build-dependencies]
helic-fw-build.workspace = true

[dependencies]
helic-core.workspace = true
helic-drivers.workspace = true
helic-rt.workspace = true
helic-fw-optoncdt.workspace = true
helic-fw-rt.workspace = true
helic-fw-support = { workspace = true, features = ["net-wiznet"] }
cortex-m-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
embassy-embedded-hal.workspace = true
embassy-executor.workspace = true
embassy-net.workspace = true
embassy-rp.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
fixed.workspace = true
panic-probe.workspace = true
static_cell.workspace = true

# Platform crates, pinned to one HELIC-DAQ release. Upgrading is a deliberate
# edit: read the tag message for consumer-visible changes first.
[workspace.dependencies]
helic-core = { git = "https://github.com/dawbarton/helic-daq", tag = "v0.2.4" }
helic-drivers = { git = "https://github.com/dawbarton/helic-daq", tag = "v0.2.4" }
helic-rt = { git = "https://github.com/dawbarton/helic-daq", tag = "v0.2.4" }
helic-fw-build = { git = "https://github.com/dawbarton/helic-daq", tag = "v0.2.4" }
helic-fw-optoncdt = { git = "https://github.com/dawbarton/helic-daq", tag = "v0.2.4" }
helic-fw-rt = { git = "https://github.com/dawbarton/helic-daq", tag = "v0.2.4", features = ["rt-sram"] }
helic-fw-support = { git = "https://github.com/dawbarton/helic-daq", tag = "v0.2.4", default-features = false }

# Embassy versions must match those the pinned platform crates were built
# against (`firmware/Cargo.toml` at that tag). A mismatch presents as type
# errors on identically named types, not as a version conflict.
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = { version = "1.3.0", features = ["disable-blocking-mode"] }
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-net = { version = "0.9.1", features = ["medium-ethernet", "proto-ipv4", "tcp", "udp", "dhcpv4", "defmt"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "defmt", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
fixed = "1.31.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[profile.release]
debug = 2
lto = true
opt-level = 3

[profile.dev]
opt-level = 1
