name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Rebuild weekly against the platform's main branch. An out-of-tree rig is
    # not rebuilt by the platform's CI, so a shared-crate change that breaks
    # this rig would otherwise surface only at the next bring-up.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  HELIC_DAQ_TAG: v0.2.4

jobs:
  rig:
    name: Magneto-elastic rig firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the platform verification gates
        run: pip install "helic-daq @ git+https://github.com/dawbarton/helic-daq@${HELIC_DAQ_TAG}#subdirectory=host-python"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --workspace -- -D warnings
      - run: cargo build --release
      - name: Build the W6100 variant
        run: cargo build --release --no-default-features --features board-w6100
      - name: Check crate dependency boundaries
        run: helic-deps-check --policy dependency-policy.toml
      - name: Check real-time symbols are SRAM-resident
        run: helic-rt-layout --profile rig-profile.toml --elf-dir target/thumbv8m.main-none-eabihf/release

  platform-drift:
    name: Build against platform main
    # Scheduled only: this deliberately ignores the pinned tag to detect
    # upstream drift early. A failure here is a warning about the next
    # upgrade, not a defect in the pinned build.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv8m.main-none-eabihf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repoint the platform crates at main
        run: |
          sed -i 's|tag = "v[0-9.]*"|branch = "main"|g' Cargo.toml
          cargo update
      - run: pip install "helic-daq @ git+https://github.com/dawbarton/helic-daq@main#subdirectory=host-python"
      - run: cargo build --release
      - run: helic-rt-layout --profile rig-profile.toml --elf-dir target/thumbv8m.main-none-eabihf/release
